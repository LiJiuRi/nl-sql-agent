# 启动前需设置的环境变量(凭证走 env,不写死):
#   ZHIPU_API_KEY=...                 # 智谱 GLM key(必填;用 Coding Plan 套餐时 base-url 取下方 coding 端点)
#   MEMORY_DB_URL='jdbc:mysql://host:3306/dst_db_invoice?useSSL=false&serverTimezone=Asia/Shanghai'
#       MEMORY_DB_USER=... MEMORY_DB_PASSWORD=...                                    # 记忆库(可写,ADR-0007)
#   MYSQL_BILL_URL='jdbc:mysql://host:3306/dst_db_bill?...' MYSQL_BILL_USER=bill_query_account MYSQL_BILL_PASSWORD=...  # 只读账单库(传给 db-mcp-server 子进程)
#   JWT_SECRET=...                    # 至少 32 字符
#   ADMIN_PW_HASH='$2a$10$...'        # 可选,覆盖默认 admin 密码 hash
spring:
  ai:
    openai:
      # 智谱 GLM 走 OpenAI 兼容端点(Spring AI 2.0 无 ZhipuAI 专用 starter)
      # 用 GLM Coding Plan 套餐 key 时,base-url 改为 https://open.bigmodel.cn/api/coding/paas/v4/
      base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4/}
      api-key: ${ZHIPU_API_KEY}
      chat:
        options:
          model: ${ZHIPU_MODEL:glm-5.2}
          temperature: 0.2
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always            # MySQL 必须显式开(默认 embedded 不执行建表)
            schema: classpath:schema-mysql.sql   # 自备 schema(统一 invoice_agent_ 表名;2.0 bundled 脚本表名是默认的)
    mcp:
      client:
        stdio:
          connections:
            db-server:
              command: ${java.home}/bin/java.exe
              args:
                - "-jar"
                - "${DB_MCP_SERVER_JAR:./db-mcp-server/target/db-mcp-server-0.1.0-SNAPSHOT.jar}"
              env:                                   # 只读账单库凭证显式转发给子进程(-D 系统属性/OS 继承都不可靠)
                MYSQL_BILL_URL: ${MYSQL_BILL_URL}
                MYSQL_BILL_USER: ${MYSQL_BILL_USER}
                MYSQL_BILL_PASSWORD: ${MYSQL_BILL_PASSWORD}
  datasource:
    # 记忆库(中心 MySQL 的 dst_db_invoice 库,可写账号,ADR-0007)——与只读账单库隔离
    url: ${MEMORY_DB_URL}
    username: ${MEMORY_DB_USER}
    password: ${MEMORY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    banner-mode: off

server:
  port: 8080

app:
  memory:
    max-messages: 10   # 轻量多轮:保留最近 10 条消息
  auth:
    jwt-secret: ${JWT_SECRET:change-this-jwt-secret-need-at-least-32-chars-long-xxxxx}
    jwt-ttl-hours: 24
    users:
      # 预设账号(管理员加人在此);密码 BCrypt hash。默认 admin/admin123(生产务必用 ADMIN_PW_HASH 覆盖)
      - username: admin
        password-hash: ${ADMIN_PW_HASH:$2a$10$nzU3botqd2PhU/oVS.tXO.8WASLIecqOY4EHHzaQRs.W5jcyV/lJm}

logging:
  level:
    # 排障时 export AI_LOG_LEVEL=DEBUG,可看完整 LLM 往返与工具调用决策
    org.springframework.ai: ${AI_LOG_LEVEL:INFO}